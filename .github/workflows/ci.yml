name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/core
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vgs
          POSTGRES_PASSWORD: vgs
          POSTGRES_DB: vgs_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vgs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://vgs:vgs@localhost:5432/vgs_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  gateway:
    # Runs once the Node gateway exists (step 2).
    if: ${{ hashFiles('apps/gateway-baileys/package.json') != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/gateway-baileys
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm test --if-present

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
